name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL=$(ls *.tgz)
          gh release create "${{ github.ref_name }}" "$TARBALL" \
            --title "${{ github.ref_name }}" \
            --generate-notes
